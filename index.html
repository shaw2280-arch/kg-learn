    #welcome-screen {

      background: #fff; border: 4px solid #ff922b;
      border-radius: 25px; padding: 25px 15px; width: 90%; max-width: 360px;

    .level-btn {
      width: 100%; margin: 10px 0; padding: 15px; border: none;
      border-radius: 18px; font-size: 18px; font-weight: bold; color: white;

      touch-action: manipulation;
    }
    .level-btn:active { transform: scale(0.96); }
    .btn-kg1 { background: linear-gradient(45deg, #20c997, #099268); }
    .btn-kg2 { background: linear-gradient(45deg, #ff6b6b, #e03131); }

    #top-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 12px; background: #fff3bf; border-bottom: 2px solid #ffd43b;

    .btn-change {

    }
    .cat-btn {
      background: #f1f3f5; border: 2px solid #adb5bd; border-radius: 20px;
      padding: 5px 11px; font-size: 12px; font-weight: bold; color: #495057; cursor: pointer;
    }
    .cat-btn.active {
      background: #ff6b6b; border-color: #ff6b6b; color: white; transform: scale(1.05);
    }

    #catch-counter { font-size: 13px; color: #4c6ef5; font-weight: bold; margin-top: 2px; }

  <script>
    let audioCtx = null;
    let spellTimer = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, type, duration, vol) {
      initAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
      } catch(e){}
    }

    function soundBoing() {
      initAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(220, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
      } catch(e){}
    }

    function soundWin() {
      [261, 329, 392, 523].forEach((f, i) => setTimeout(() => playTone(f, 'triangle', 0.2, 0.3), i * 90));
    }
    function soundError() { playTone(140, 'sawtooth', 0.25, 0.3); }

    // دالة النطق الخارجي عبر ResponsiveVoice (تتخطى حظر الـ APK تماماً)
    function speakText(text, lang = 'ar') {
      initAudio();
      if (typeof responsiveVoice !== 'undefined') {
        let voiceName = (lang === 'ar') ? "Arabic Female" : "UK English Female";
        responsiveVoice.speak(text, voiceName, { rate: 0.9 });
      } else {
        // بديل احتياطي لو المكتبة لم تحمل
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(text);
          utter.lang = (lang === 'ar') ? 'ar-SA' : 'en-US';
          utter.rate = 0.85;
          window.speechSynthesis.speak(utter);
        }
      }
    }

    function spellCurrentItem() {
      initAudio();
      if (spellTimer) clearTimeout(spellTimer);
      const item = data[curCategory][curIndex];

      if (item.spell && item.spell.length > 0) {
        item.spell.forEach((letter, idx) => {
          setTimeout(() => {
            document.getElementById('main-sub').innerText = letter;
            speakText(letter, item.lang || 'ar');
          }, idx * 1000);
        });
        spellTimer = setTimeout(() => {
          document.getElementById('main-sub').innerText = item.n;
          speakText(item.n, item.lang || 'ar');
        }, item.spell.length * 1000 + 200);
      } else {
        speakText(item.n, item.lang || 'ar');
      }
    }

      ]
    };

    let curGrade = 'kg1';
    let curCategory = 'letters_ar';
    let curIndex = 0;
    let huntStep = 0;

    function selectGrade(g) {
      initAudio();
      curGrade = g;
      document.getElementById('welcome-screen').style.display = 'none';
      document.getElementById('level-text').innerText = (g === 'kg1') ? 'المستوى: KG 1' : 'المستوى: KG 2';
      curIndex = 0; renderItems(); loadItem();
    }

    const b1 = document.getElementById('btn-kg1');
    const b2 = document.getElementById('btn-kg2');
    ['click', 'touchstart'].forEach(ev => {
      b1.addEventListener(ev, (e) => { e.preventDefault(); selectGrade('kg1'); }, { passive: false });
      b2.addEventListener(ev, (e) => { e.preventDefault(); selectGrade('kg2'); }, { passive: false });
    });

    function switchCategory(cat, btn) {
      curCategory = cat; curIndex = 0; huntStep = 0;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active'); renderItems(); loadItem();
    }

    function renderItems() {
      const bar = document.getElementById('items-bar');
      bar.innerHTML = '';
      data[curCategory].forEach((it, idx) => {
        const span = document.createElement('span');
        span.className = 'mini-item' + (idx === curIndex ? ' active' : '');
        span.innerText = it.c;
        ['click', 'touchstart'].forEach(ev => {
          span.addEventListener(ev, (e) => {
            e.preventDefault();
            curIndex = idx;
            loadItem();
            speakText(it.n, it.lang || 'ar');
          }, { passive: false });
        });
        bar.appendChild(span);
      });
    }

    function loadItem() {
      huntStep = 0;
      const item = data[curCategory][curIndex];
      const disp = document.getElementById('main-display');
      disp.style.display = 'flex'; disp.style.left = '50%'; disp.style.top = '44%';
      document.getElementById('main-char').innerText = item.c;
      document.getElementById('main-sub').innerText = (curGrade === 'kg2' || curCategory !== 'letters_ar') ? item.n : '';
      document.getElementById('catch-counter').innerText = 'المحاولة: 1 من 3 🏃‍♂️';
      renderItems();
      speakText(item.n, item.lang || 'ar');
    }

    const mainDisp = document.getElementById('main-display');
    ['click', 'touchstart'].forEach(ev => {
      mainDisp.addEventListener(ev, (e) => {
        e.preventDefault();
        const item = data[curCategory][curIndex];
        speakText(item.n, item.lang || 'ar');
        huntItem();
      }, { passive: false });
    });

    function huntItem() {
      huntStep++;
      const item = data[curCategory][curIndex];
      soundBoing();
      if (huntStep === 1) {
        mainDisp.style.left = '25%'; mainDisp.style.top = '35%';
        document.getElementById('catch-counter').innerText = 'هرب! الحقه سريعا! 🏃‍♂️';
        speakText(item.n, item.lang || 'ar');
      } else if (huntStep === 2) {
        mainDisp.style.left = '75%'; mainDisp.style.top = '55%';
        document.getElementById('catch-counter').innerText = 'اقتربت من صيده! اضغط مرة أخرى! 🎯';
        speakText(item.n, item.lang || 'ar');
      } else {
        mainDisp.style.display = 'none'; huntStep = 0; soundWin();
        setTimeout(showQuiz, 300);
      }
    }

    function showQuiz() {
      const item = data[curCategory][curIndex];
      const list = data[curCategory];
      const qBox = document.getElementById('quiz-box');
      const qOpts = document.getElementById('quiz-options');
      qOpts.innerHTML = '';
      let choices = [item];
      while (choices.length < Math.min(4, list.length)) {
        let r = list[Math.floor(Math.random() * list.length)];
        if (!choices.includes(r)) choices.push(r);
      }
      choices.sort(() => Math.random() - 0.5);
      choices.forEach(opt => {
        const b = document.createElement('button');
        b.className = 'option-btn';
        b.innerText = (curCategory === 'letters_ar' && curGrade === 'kg1') ? opt.c : opt.n;
        ['click', 'touchstart'].forEach(ev => {
          b.addEventListener(ev, (e) => {
            e.preventDefault();
            speakText(opt.n, opt.lang || 'ar');
            if (opt === item) {
              soundWin();
              setTimeout(() => { qBox.style.display = 'none'; nextItem(); }, 1000);
            } else {
              soundError();
            }
          }, { passive: false });
        });
        qOpts.appendChild(b);
      });
      qBox.style.display = 'block';
    }

    function openAiModal() {
      initAudio();
      document.getElementById('ai-response').innerText = 'اختر قصة قصيرة أو فزورة ممتعة!';
      document.getElementById('ai-modal').style.display = 'block';
      speakText('أهلاً بك في قسم المعلم الذكي', 'ar');
    }

    function aiAction(type) {
      const item = data[curCategory][curIndex];
      const txt = (type === 'story') ? `كان يا ما كان، صديقنا الجميل ${item.n} يحب اللعب والتعلم معنا كل يوم!` : `فزورة للأذكياء: من هو العنصر الجميل الذي يبدأ أو يمثل ${item.n}?`;
      document.getElementById('ai-response').innerText = txt;
      speakText(txt, 'ar');
    }

    function nextItem() { 
      curIndex = (curIndex + 1) % data[curCategory].length; 
      loadItem(); 
    }
    function prevItem() { 
      curIndex = (curIndex - 1 + data[curCategory].length) % data[curCategory].length; 
      loadItem(); 
    }

    renderItems();
  </script>
