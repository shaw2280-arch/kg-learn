<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>تحدي النقاط والحروف - KG Learn</title>
  <style>
    .header, .footer, .blog-pager, .comments, .post-nav, nav, header, .sidebar, .post-header {
      display: none !important;
    }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
      background: radial-gradient(circle, #fff9db 0%, #ffd8a8 100%);
      text-align: center;
      transition: background 0.3s;
    }
    #welcome-screen {
      position: fixed; inset: 0;
      background: rgba(255, 243, 191, 0.98);
      z-index: 999; display: flex; flex-direction: column;
      justify-content: center; align-items: center; padding: 20px;
    }
    .welcome-card {
      background: #fff; border: 4px solid #ff922b;
      border-radius: 25px; padding: 25px 15px; width: 90%; max-width: 360px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }
    .level-btn {
      width: 100%; margin: 10px 0; padding: 15px; border: none;
      border-radius: 18px; font-size: 18px; font-weight: bold; color: white;
      cursor: pointer; display: block; box-shadow: 0 5px 15px rgba(0,0,0,0.15);
      touch-action: manipulation;
    }
    .level-btn:active { transform: scale(0.96); }
    .btn-kg1 { background: linear-gradient(45deg, #20c997, #099268); }
    .btn-kg2 { background: linear-gradient(45deg, #ff6b6b, #e03131); }

    #top-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 12px; background: #fff3bf; border-bottom: 2px solid #ffd43b;
      font-size: 14px; font-weight: bold; color: #d9480f;
    }
    .btn-change {
      background: #e8590c; color: white; border: none;
      padding: 4px 10px; border-radius: 10px; font-size: 12px; cursor: pointer;
    }

    #categories-bar {
      display: flex; overflow-x: auto; gap: 6px; padding: 6px;
      background: #ffffffdd; white-space: nowrap; -webkit-overflow-scrolling: touch;
    }
    .cat-btn {
      background: #f1f3f5; border: 2px solid #adb5bd; border-radius: 20px;
      padding: 5px 11px; font-size: 12px; font-weight: bold; color: #495057; cursor: pointer;
    }
    .cat-btn.active {
      background: #ff6b6b; border-color: #ff6b6b; color: white; transform: scale(1.05);
    }

    #games-bar {
      display: flex; overflow-x: auto; gap: 5px; padding: 5px 8px;
      background: rgba(121, 80, 242, 0.12); border-bottom: 2px solid #7950f2;
      white-space: nowrap; -webkit-overflow-scrolling: touch; justify-content: flex-start;
    }
    .promo-game-btn {
      background: linear-gradient(45deg, #7950f2, #be4bdb); color: white; border: none;
      padding: 5px 9px; border-radius: 12px; font-size: 11px; font-weight: bold; cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15); display: inline-flex; align-items: center; gap: 3px;
      flex-shrink: 0;
    }
    .promo-game-btn:active { transform: scale(0.95); }

    #items-bar {
      display: flex; overflow-x: auto; padding: 6px 8px; gap: 8px;
      background: #ffffff99; white-space: nowrap; -webkit-overflow-scrolling: touch;
    }
    .mini-item {
      display: inline-block; min-width: 44px; height: 42px; line-height: 38px;
      background: #fff; border: 2px solid #fd7e14; border-radius: 12px;
      font-size: 18px; font-weight: bold; color: #e8590c; cursor: pointer; padding: 0 4px;
    }
    .mini-item.active { background: #e8590c; color: #fff; transform: scale(1.1); }

    #stage-title { font-size: 15px; color: #d6336c; margin-top: 6px; font-weight: bold; }
    #catch-counter { font-size: 13px; color: #4c6ef5; font-weight: bold; margin-top: 2px; }

    #main-display {
      position: absolute;
      cursor: pointer;
      display: flex; flex-direction: column; align-items: center;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 100;
      padding: 10px;
    }
    
    @keyframes popAppear {
      0% { transform: scale(0) rotate(-20deg); opacity: 0; }
      70% { transform: scale(1.15) rotate(10deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .animate-pop {
      animation: popAppear 0.4s ease forwards;
    }

    #main-char {
      font-size: 85px; font-weight: bold; color: #3b5bdb;
      text-shadow: 2px 4px 0 #fff; line-height: 1.1;
    }
    #main-sub {
      font-size: 16px; font-weight: bold; color: #fa5252;
      background: #ffffffdd; padding: 4px 14px; border-radius: 20px;
      margin-top: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      white-space: nowrap;
    }

    #nav-controls {
      position: fixed; bottom: 20px; width: 100%;
      display: flex; justify-content: space-around; padding: 0 8px; z-index: 150;
    }
    .btn {
      background: #12b886; color: white; border: none;
      padding: 9px 14px; font-size: 14px; font-weight: bold;
      border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); cursor: pointer;
    }
    .btn-spell { background: #fab005; color: #333; }
    .btn-ai { background: linear-gradient(45deg, #7950f2, #be4bdb); }
    .btn-nav { background: #4dabf7; }

    #ai-modal {
      display: none; position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%); width: 90%; max-width: 360px;
      background: #fff; border-radius: 25px; padding: 18px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4); border: 5px solid #be4bdb; z-index: 1001; text-align: right;
    }
    #ai-response {
      max-height: 110px; overflow-y: auto; background: #f8f0fc; border-radius: 12px;
      padding: 10px; font-size: 13px; color: #333; margin: 8px 0; line-height: 1.4;
    }
    .ai-btn { background: #be4bdb; color: white; border: none; padding: 7px 12px; border-radius: 12px; font-size: 12px; font-weight: bold; cursor: pointer; margin: 2px; }

    #memory-modal {
      display: none; position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%); width: 92%; max-width: 380px;
      background: linear-gradient(135deg, #fff9db 0%, #ffffff 100%);
      border-radius: 25px; padding: 20px;
      box-shadow: 0 15px 45px rgba(0,0,0,0.35); border: 4px solid #20c997; z-index: 2000; text-align: center;
    }
    .memory-options {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px;
    }
    .memory-option-btn {
      background: #4dabf7; color: white; border: none; padding: 12px;
      border-radius: 15px; font-size: 20px; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: transform 0.2s;
    }
    .memory-option-btn:active { transform: scale(0.95); }
  </style>
</head>
<body>

  <div id="welcome-screen">
    <div class="welcome-card">
      <div style="font-size: 40px; margin-bottom: 5px;">🎒✨</div>
      <h2 style="color: #2b8a3e; margin-bottom: 8px;">مرحبا بكم يا أبطال!</h2>
      <p style="color: #555; font-size: 14px; margin-bottom: 15px;">اختر المرحلة لبدء التعلّم:</p>
      <button class="level-btn btn-kg1" onclick="selectLevel('KG 1')">🌱 مرحلة KG 1</button>
      <button class="level-btn btn-kg2" onclick="selectLevel('KG 2')">⭐ مرحلة KG 2</button>
    </div>
  </div>

  <div id="top-bar">
    <span id="level-text">المستوى: KG 1</span>
    <button class="btn-change" onclick="document.getElementById('welcome-screen').style.display='flex'">تغيير المرحلة 🔄</button>
  </div>

  <div id="categories-bar">
    <button class="cat-btn active" onclick="switchCategory('letters_ar', this)">حروف عربية أ-ي</button>
    <button class="cat-btn" onclick="switchCategory('harakat_ar', this)">حركات الحروف (28)</button>
    <button class="cat-btn" onclick="switchCategory('colors_ar', this)">ألوان عربية (12)</button>
    <button class="cat-btn" onclick="switchCategory('days_ar', this)">أيام الأسبوع (7)</button>
    <button class="cat-btn" onclick="switchCategory('numbers_ar', this)">أرقام عربية 1-20</button>
    <button class="cat-btn" onclick="switchCategory('words_ar', this)">كلمات عربية (28)</button>
    <button class="cat-btn" onclick="switchCategory('letters_en', this)">English A-Z</button>
    <button class="cat-btn" onclick="switchCategory('phonics_en', this)">أصوات Phonics (26)</button>
    <button class="cat-btn" onclick="switchCategory('colors_en', this)">Colors (12)</button>
    <button class="cat-btn" onclick="switchCategory('days_en', this)">Days of Week (7)</button>
    <button class="cat-btn" onclick="switchCategory('numbers_en', this)">Numbers 1-20</button>
    <button class="cat-btn" onclick="switchCategory('words_en', this)">English Words (12)</button>
  </div>

  <div id="games-bar">
    <button class="promo-game-btn" onclick="openOtherGame('points_challenge')">🔠 تحدي النقاط</button>
    <button class="promo-game-btn" onclick="openOtherGame('offline_50')">🎮 50 لعبة</button>
    <button class="promo-game-btn" onclick="openOtherGame('clothes')">👗 تنسيق الملابس</button>
    <button class="promo-game-btn" onclick="openOtherGame('traffic')">🚦 تطبيق المرور</button>
    <button class="promo-game-btn" onclick="openOtherGame('cubes')">🦁 مكعبات الحيوانات</button>
  </div>

  <div id="items-bar"></div>

  <div id="stage-title">🎯 اصطد العنصر قبل أن يهرب! (ناطق حقيقي)</div>
  <div id="catch-counter">المحاولة: 1 من 4 🏃‍♂️</div>

  <div id="main-display" onclick="huntItem()">
    <div id="main-char">🔴</div>
    <div id="main-sub">أحمر</div>
  </div>

  <div id="nav-controls">
    <button class="btn btn-nav" onclick="prevItem()">السابق ⬅️</button>
    <button class="btn btn-ai" onclick="openAiModal()">المعلم 🤖</button>
    <button class="btn btn-spell" onclick="spellCurrentItem()">تهجئة 🔤</button>
    <button class="btn btn-nav" onclick="nextItem()">التالي ➡️</button>
  </div>

  <div id="ai-modal">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="margin:0; color:#7950f2;">🤖 المعلم الذكي</h3>
      <button onclick="document.getElementById('ai-modal').style.display='none'" style="border:none; background:#ff6b6b; color:#fff; border-radius:50%; width:26px; height:26px; font-weight:bold; cursor:pointer;">✕</button>
    </div>
    <div id="ai-response">اضغط لاختيار قصة أو فزورة!</div>
    <div>
      <button class="ai-btn" onclick="aiAction('story')">📖 قصة</button>
      <button class="ai-btn" onclick="aiAction('quiz')">🧩 فزورة</button>
    </div>
  </div>

  <div id="memory-modal">
    <h3 style="color: #099268; margin-bottom: 5px;">🧠 اختبار الذاكرة الذكي</h3>
    <p id="memory-question-text" style="font-size: 15px; color: #333; margin-bottom: 10px; font-weight: bold;">أين هو الحرف الصحيح؟</p>
    <div id="memory-options-container" class="memory-options"></div>
    <button onclick="closeMemoryModal()" style="margin-top: 15px; background: #ff6b6b; color: white; border: none; padding: 6px 16px; border-radius: 12px; font-size: 13px; font-weight: bold; cursor: pointer;">إغلاق ✕</button>
  </div>

  <script>
    let audioCtx = null;
    let spellTimer = null;
    let curCategory = 'letters_ar';
    let curIndex = 0;
    let catchStep = 1;
    const maxSteps = 4;

    const data = {
      letters_ar: [
        {c:'أ', n:'ألف', spell:['أ', 'ل', 'ف'], story:'يحكى أن حرف الألف هو أول الحروف وأطولها وقوفاً كالأشجار المثمرة.', quiz:'ما هو الحرف الذي يبدأ به اسم أسد؟'},
        {c:'ب', n:'باء', spell:['ب', 'ا', 'ء'], story:'حرف الباء يحمل نقطة تحته مثل البطل الذي يحرس كنزه الثمين.', quiz:'حرف جميل تحته نقطة واحدة، فما هو؟'},
        {c:'ت', n:'تاء', spell:['ت', 'ا', 'ء'], story:'التاء المبسوطة تشبه الابتسامة الجميلة التي نوزعها على أصدقائنا.', quiz:'حرف فوقه نقطتان مثل العينين الساهرتين، فما هو؟'},
        {c:'ث', n:'ثاء', spell:['ث', 'ا', 'ء'], story:'الثاء الهادئ يحب الثعلب الماكر ويختبئ منه بين الحقول.', quiz:'حرف عليه ثلاث نقاط كأنها تاج صغير؟'},
        {c:'ج', n:'جيم', spell:['ج', 'ي', 'م'], story:'الجيم الجميل يسكن في وسط الصحراء مع الجمل الصبور.', quiz:'حرف في بطنه نقطة دائرية كأنه حبة لؤلؤ؟'},
        {c:'ح', n:'حاء', spell:['ح', 'ا', 'ء'], story:'الحاء الصافي يعيش بجانب النهر العذب ويحب حمامات السلام.', quiz:'حرف بلا نقاط أبيض كالقلب الطيب؟'},
        {c:'خ', n:'خاء', spell:['خ', 'ا', 'ء'], story:'الخاء المغامر يحمل فوقه نقطة كأنه قبعة تسلق الجبال.', quiz:'حرف فوقه نقطة واحدة من الأعلى؟'},
        {c:'د', n:'دال', spell:['د', 'ا', 'ل'], story:'الدال المستقيم ينحني برفق ليساعد كل محتاج في طريقه.', quiz:'حرف مقوس يشبه زحليقة الحديقة؟'},
        {c:'ذ', n:'ذال', spell:['ذ', 'ا', 'ل'], story:'الذال الذكي يفكر دائماً بحكمة وهدوء قبل أن يتكلم.', quiz:'حرف مقوس وفوقه نقطة وحيدة؟'},
        {c:'ر', n:'راء', spell:['ر', 'ا', 'ء'], story:'الراء المزحلق ينزلق بفرح على قوس قزح الملون.', quiz:'حرف يشبه الهلال الصغير المائل؟'},
        {c:'ز', n:'زاي', spell:['ز', 'ا', 'ء'], story:'الزاي السريع يجري بسرعة البرق مع الزرافة الطويلة.', quiz:'حرف مائل وله نقطة فوق رأسه كالنجمة؟'},
        {c:'س', n:'سين', spell:['س', 'ي', 'ن'], story:'السين له ثلاثة أسنان قوية يأكل بها التفاح السكري.', quiz:'حرف له ثلاثة أسنان بارزة؟'},
        {c:'ش', n:'شين', spell:['ش', 'ي', 'ن'], story:'الشين الشجاع يحب السفر تحت أشعة الشمس الدافئة.', quiz:'حرف ذو ثلاثة أسنان وعليه ثلاث نقاط؟'},
        {c:'ص', n:'صاد', spell:['ص', 'ا', 'د'], story:'الصاد الصادق يروي لنا قصص الأبطال والشجعان.', quiz:'حرف له جسم مستدير وذيل صغير؟'},
        {c:'ض', n:'ضاد', spell:['ض', 'ا', 'د'], story:'الضاد لغة الضاد العريقة تسكن في قلوبنا بكل فخر.', quiz:'حرف الصاد ولكن فوقه نقطة؟'},
        {c:'ط', n:'طاء', spell:['ط', 'ا', 'ء'], story:'الطاء الطائر يحلق عالياً في السماء الزرقاء الصافية.', quiz:'حرف يطير فوقه عمود مستقيم؟'},
        {c:'ظ', n:'ظاء', spell:['ظ', 'ا', 'ء'], story:'الظاء المنتظر يحمي الحديقة من المطر الغزير.', quiz:'حرف الطاء ولكن فوقه نقطة حارسة؟'},
        {c:'ع', n:'عين', spell:['ع', 'ي', 'ن'], story: 'العين الباصرة ترقب النجوم المضيئة في الليل الحالك.', quiz:'حرف يشبه الموجة المتلاحقة المفتوحة؟'},
        {c:'غ', n:'غين', spell:['غ', 'ي', 'ن'], story:'الغين المغامر يبحث عن الكنوز تحت الغيوم العالية.', quiz:'حرف يشبه العين ولكن فوقه نقطة؟'},
        {c:'ف', n:'فاء', spell:['ف', 'ا', 'ء'], story:'الفاء الفراشة تطير بخفة بين الزهور الملونة.', quiz:'حرف دائر وله ذراع ممدودة ونقطة فوقه؟'},
        {c:'ق', n:'قاف', spell:['ق', 'ا', 'ف'], story:'القاف القوي يقف بشموخ فوق قمة الجبل العالي.', quiz:'حرف دائر وله نقطتان كالعينين المفتوحتين؟'},
        {c:'ك', n:'كاف', spell:['ك', 'ا', 'ف'], story:'الكاف الكريم يقدم الهدايا لكل الأطفال الأطهار.', quiz:'حرف يشبه اليد الممدودة بالكرم؟'},
        {c:'ل', n:'لام', spell:['ل', 'ا', 'م'], story:'اللام اللطيف يربط الحروف ببعضها كأنه عقد من الألماس.', quiz:'حرف طويل يشبه العكاز المعقوف؟'},
        {c:'م', n:'ميم', spell:['م', 'ي', 'م'], story:'الميم المرح يحب المزاح واللعب مع الموز الأصفر.', quiz:'حرف دائري صغير وله ذيل قصير للأفل؟'},
        {c:'ن', n:'نون', spell:['ن', 'و', 'ن'], story:'النون النجمي يضيء عتمة الليل بنوره الجميل.', quiz:'حرف عميق وبداخله نقطة واحدة؟'},
        {c:'هـ', n:'هاء', spell:['هـ', 'ا', 'ء'], story:'الهاء المبتسم يضحك دائماً ويمسح دموع الحزن.', quiz:'حرف دائري مزدوج يبتسم لنا؟'},
        {c:'و', n:'واو', spell:['و', 'ا', 'و'], story:'الواو الودود يصل بين القلوب والمحبة الصادقة.', quiz:'حرف صغير له رأس مدور وذيل مائل؟'},
        {c:'ي', n:'ياء', spell:['ي', 'ا', 'ء'], story:'الياء الختامي ينهي حكاياتنا الممتعة بابتسامة دافئة.', quiz:'حرف قاعدته مقوسة وتحته نقطتان؟'}
      ],
      harakat_ar: [
        {c:'أَ', n:'أ فتحة أرنب', spell:['أ', 'فتحة', 'أرنب'], story:'الأرنب الشقي يقفز فوق الفتحة العالية بكل نشاط وحيوية.', quiz:'ما هو الحيوان الذي يبدأ بحرف الألف المفتوح؟'},
        {c:'بَ', n:'ب فتحة بطة', spell:['ب', 'فتحة', 'بطة'], story:'البطة الماهرة تسبح في البحيرة وتغني لحن الفتحة الجميل.', quiz:'طائر يسبح في الماء ويبدأ بالباء المفتوحة؟'},
        {c:'تَ', n:'ت فتحة تمر', spell:['ت', 'فتحة', 'تمر'], story:'التمر الحلو يمدنا بالطاقة والنشاط طوال اليوم الدراسي.', quiz:'طعام صحي ولذيذ يبدأ بالتاء المفتوحة؟'},
        {c:'ثَ', n:'ث فتحة ثعلب', spell:['ث', 'فتحة', 'ثعلب'], story:'الثعلب الذكي يجري بخفة بين الأشجار الطويلة.', quiz:'حيوان مكر يبدأ بالثاء المفتوحة؟'},
        {c:'جَ', n:'ج فتحة جمل', spell:['ج', 'فتحة', 'جمل'], story:'الجمل الصبور يتحمل حرارة الصحراء الواسعة.', quiz:'سفينة الصحراء تبدأ بالجيم المفتوحة؟'},
        {c:'حَ', n:'ح فتحة حمامة', spell:['ح', 'فتحة', 'حمامة'], story:'الحمامة البيضاء تحمل رسائل السلام والمحبة.', quiz:'طائر السلام الذي يبدأ بالحاء المفتوحة؟'},
        {c:'خَ', n:'خ فتحة خروف', spell:['خ', 'فتحة', 'خروف'], story: 'الخروف الصغير يرعى في المرج الأخضر الفسيح.', quiz:'حيوان صوفي أبيض يبدأ بالخاء المفتوحة؟'},
        {c:'دَ', n:'د فتحة دجاجة', spell:['د', 'فتحة', 'دجاجة'], story:'الدجاجة النشيطة توقظنا مبكرة كل صباح.', quiz:'طائر أليف يبدأ بالدال المفتوحة؟'},
        {c:'ذَ', n:'ذ فتحة ذيل', spell:['ذ', 'فتحة', 'ذيل'], story:'الذيل الطويل يوازن الحيوانات أثناء الركض.', quiz:'جزء من جسم الحيوان يبدأ بالذال المفتوحة؟'},

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function selectLevel(levelName) {
      initAudio();
      document.getElementById('welcome-screen').style.display = 'none';
      document.getElementById('level-text').innerText = 'المستوى: ' + levelName;
      speakTextWithFallback('مرحباً بك في ' + levelName, 'ar');
      updateDisplay();
    }

    function openOtherGame(gameType) {
      initAudio();
      let links = {
        'points_challenge': 'https://play.google.com/store/apps/details?id=com.mindsprint.pointschallenge',
        'offline_50': 'https://play.google.com/store/apps/details?id=com.yourname.offline50', 
        'clothes': 'https://play.google.com/store/apps/details?id=com.yourname.clothes',
        'traffic': 'https://play.google.com/store/apps/details?id=com.mindsprint.traffic',
        'cubes': 'https://play.google.com/store/apps/details?id=com.mindsprint.cubes'
      };

      if (links[gameType]) {
        window.open(links[gameType], '_system');
      }
    }

    function speakTextWithFallback(text, lang = 'ar') {
      initAudio();
      
      if ('speechSynthesis' in window) {
        try {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(text);
          utter.lang = (lang === 'en') ? 'en-US' : 'ar-SA';
          utter.rate = 0.85;
          window.speechSynthesis.speak(utter);
        } catch(e) {}
      }

      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.25);
      } catch(e) {}
    }

    function playItemAudio(item) {
      if (item.soundLetter) {
        speakTextWithFallback(item.soundLetter, 'en');
        setTimeout(() => {
          speakTextWithFallback(item.n, 'en');
        }, 1000);
      } else {
        speakTextWithFallback(item.n, item.lang || 'ar');
      }
    }

    function soundWin() {
      [330, 440, 554, 659].forEach((f, i) => {
        setTimeout(() => {
          try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.15);
          } catch(e){}
        }, i * 80);
      });
    }

    function updateDisplay() {
      const item = data[curCategory][curIndex];
      const mainDisplay = document.getElementById('main-display');
      
      const randomX = Math.floor(Math.random() * (window.innerWidth - 180)) + 40;
      const randomY = Math.floor(Math.random() * (window.innerHeight - 350)) + 150;
      
      mainDisplay.style.left = randomX + 'px';
      mainDisplay.style.top = randomY + 'px';

      mainDisplay.classList.remove('animate-pop');
      void mainDisplay.offsetWidth;
      mainDisplay.classList.add('animate-pop');

      document.getElementById('main-char').innerText = item.c;
      document.getElementById('main-sub').innerText = item.n;
      document.getElementById('catch-counter').innerText = `المحاولة: ${catchStep} من ${maxSteps} 🏃‍♂️`;
      updateItemsBar();
    }

    function updateItemsBar() {
      const bar = document.getElementById('items-bar');
      bar.innerHTML = '';
      data[curCategory].forEach((item, idx) => {
        const btn = document.createElement('button');
        btn.className = 'mini-item' + (idx === curIndex ? ' active' : '');
        btn.innerText = item.c;
        btn.onclick = () => {
          curIndex = idx;
          catchStep = 1;
          updateDisplay();
          playItemAudio(item);
        };
        bar.appendChild(btn);
      });
    }

    function switchCategory(catKey, btnElement) {
      initAudio();
      curCategory = catKey;
      curIndex = 0;
      catchStep = 1;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
      updateDisplay();
      playItemAudio(data[curCategory][curIndex]);
    }

    function nextItem() {
      initAudio();
      curIndex = (curIndex + 1) % data[curCategory].length;
      catchStep = 1;
      updateDisplay();
      playItemAudio(data[curCategory][curIndex]);
    }

    function prevItem() {
      initAudio();
      curIndex = (curIndex - 1 + data[curCategory].length) % data[curCategory].length;
      catchStep = 1;
      updateDisplay();
      playItemAudio(data[curCategory][curIndex]);
    }

    function showMemoryQuiz() {
      const currentList = data[curCategory];
      if (currentList.length < 3) return;
      
      const correctItem = currentList[curIndex];
      let options = [correctItem];
      while (options.length < 4) {
        let randItem = currentList[Math.floor(Math.random() * currentList.length)];
        if (!options.includes(randItem)) {
          options.push(randItem);
        }
      }
      options.sort(() => Math.random() - 0.5);

      document.getElementById('memory-question-text').innerText = `أين هو الحرف الصحيح: (${correctItem.n})؟`;
      
      const container = document.getElementById('memory-options-container');
      container.innerHTML = '';
      
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'memory-option-btn';
        btn.innerText = opt.c;
        btn.onclick = () => {
          if (opt.c === correctItem.c) {
            soundWin();
            speakTextWithFallback('إجابة صحيحة يا بطل!', opt.lang || 'ar');
            closeMemoryModal();
            nextItem();
          } else {
            speakTextWithFallback('حاول مرة أخرى يا بطل', opt.lang || 'ar');
            btn.style.background = '#ff6b6b';
            setTimeout(() => { btn.style.background = '#4dabf7'; }, 600);
          }
        };
        container.appendChild(btn);
      });

      document.getElementById('memory-modal').style.display = 'block';
      speakTextWithFallback('اختبر ذاكرتك واعرف الحرف الصحيح', 'ar');
    }

    function closeMemoryModal() {
      document.getElementById('memory-modal').style.display = 'none';
      nextItem();
    }

    function huntItem() {
      initAudio();
      const item = data[curCategory][curIndex];
      catchStep++;

      if (catchStep > maxSteps) {
        soundWin();
        catchStep = 1;
        // بعد تكرار الضغط ونطق الحرف عدة مرات، يظهر مربع الاختبار
        setTimeout(() => {
          showMemoryQuiz();
        }, 500);
      } else {
        // في كل ضغطة ينطق اسم الحرف مباشرة بدون أي كلمات إضافية
        playItemAudio(item);
        updateDisplay();
      }
    }

    function spellCurrentItem() {
      initAudio();
      if (spellTimer) clearTimeout(spellTimer);
      const item = data[curCategory][curIndex];
      if (item.spell && item.spell.length > 0) {
        item.spell.forEach((letter, idx) => {
          setTimeout(() => {
            document.getElementById('main-sub').innerText = letter;
            speakTextWithFallback(letter, item.lang || 'ar');
          }, idx * 700);
        });
        spellTimer = setTimeout(() => {
          document.getElementById('main-sub').innerText = item.n;
          speakTextWithFallback(item.n, item.lang || 'ar');
        }, item.spell.length * 700 + 300);
      } else {
        playItemAudio(item);
      }
    }

    function openAiModal() {
      initAudio();
      document.getElementById('ai-modal').style.display = 'block';
      speakTextWithFallback('أهلاً بك مع المعلم الذكي', 'ar');
    }

    function aiAction(type) {
      initAudio();
      const resp = document.getElementById('ai-response');
      const item = data[curCategory][curIndex];
      let msg = '';
      
      if (type === 'story') {
        msg = item.story || `حكاية ممتعة ومميزة جداً اليوم عن البطل الرائع (${item.n})!`;
      } else {
        msg = item.quiz || `فزورة ذكية جداً عن (${item.n})! فكر بتركيز يا بطل!`;
      }
      
      resp.innerText = msg;
      speakTextWithFallback(msg, item.lang || 'ar');
    }
